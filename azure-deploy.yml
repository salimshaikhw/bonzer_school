# .github/workflows/azure-deploy.yml

name: HCB_API - Build and Deploy to Azure

on:
  push:
    branches:
      - main                  # Triggers CI/CD on push to main
  pull_request:
    branches:
      - main                  # Runs Build+Test on PRs (no deploy)

env:
  DOTNET_VERSION: '8.0'               # Change to your .NET version
  BUILD_CONFIGURATION: Release
  API_PROJECT_PATH: 'src/API'         # Path to your API project
  SOLUTION_PATH: 'HCB_API.sln'

jobs:

# ─────────────────────────────────────
# JOB 1: BUILD & TEST
# ─────────────────────────────────────
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore NuGet Packages
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build Solution
        run: dotnet build ${{ env.SOLUTION_PATH }}
             --configuration ${{ env.BUILD_CONFIGURATION }}
             --no-restore

      - name: Run Tests
        run: dotnet test ${{ env.SOLUTION_PATH }}
             --configuration ${{ env.BUILD_CONFIGURATION }}
             --no-build
             --verbosity normal
             --filter "Category!=Integration"   # skips integration tests in CI

      - name: Publish API
        run: dotnet publish ${{ env.API_PROJECT_PATH }}
             --configuration ${{ env.BUILD_CONFIGURATION }}
             --no-build
             --output ./publish

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hcb-api-artifact
          path: ./publish
          retention-days: 5

# ─────────────────────────────────────
# JOB 2: DEPLOY TO AZURE
# ─────────────────────────────────────
  deploy:
    name: Deploy to Azure App Service
    runs-on: ubuntu-latest
    needs: build                        # Only runs if build job succeeds
    if: github.ref == 'refs/heads/main' # Only deploy from main branch

    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: hcb-api-artifact
          path: ./publish

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'bonzerapi'        # ← Replace 
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
          package: ./publish